name: AI Tutor Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -q gradle-8.6-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.6/bin" >> "$GITHUB_PATH"
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Backend tests
        working-directory: backend
        run: npm test
      - name: JavaScript checks
        run: |
          node --experimental-sqlite --check backend/src/server.js
          node scripts/check-js.mjs
          node scripts/test-caption-pipeline.mjs
          node scripts/test-tutor-ui.mjs
      - name: Android build and unit tests
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-tutor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Offline playback integration test (network disabled)
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 1200
          disable-animations: true
          disable-spellchecker: true
          script: |
            set -eu
            gradle --no-daemon :app:assembleDebugAndroidTest
            # The emulator action has completed its boot wait; recover transient offline ADB state.
            adb reconnect offline || true
            adb wait-for-device
            # ADB transport can be online before Android's package/input services finish booting.
            sleep 60
            adb shell getprop sys.boot_completed
            adb shell service check package
            adb shell service check activity
            adb shell input keyevent 82 || true
            timeout 4m adb install --no-streaming -r app/build/outputs/apk/debug/app-debug.apk
            timeout 4m adb install --no-streaming -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell svc wifi disable
            timeout 8m adb shell am instrument -w -r com.pwskills.mobile.pwpm02.test/androidx.test.runner.AndroidJUnitRunner
