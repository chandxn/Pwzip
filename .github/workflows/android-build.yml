
name: PW-PM Final Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, Test and Deliver APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.6
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -q gradle-8.6-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.6/bin" >> "$GITHUB_PATH"

      - name: Extract project
        id: extract
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/pwpm"
          unzip -q yooo.zip -d "$RUNNER_TEMP/pwpm"
          ROOT="$(find "$RUNNER_TEMP/pwpm" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -printf '%h\n' | head -1)"
          test -n "$ROOT"
          test -d "$ROOT/app"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"

      - name: Restore genuine Gradle wrapper
        env:
          ROOT: ${{ steps.extract.outputs.root }}
        run: |
          set -e
          cd "$ROOT"
          gradle wrapper --gradle-version 8.6 --distribution-type bin
          chmod +x gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null

      - name: Build APK and run tests
        id: build
        continue-on-error: true
        env:
          ROOT: ${{ steps.extract.outputs.root }}
        run: |
          set -o pipefail
          cd "$ROOT"
          ./gradlew --no-daemon clean assembleDebug testDebugUnitTest 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect APK, reports and corrected source
        if: always()
        env:
          ROOT: ${{ steps.extract.outputs.root }}
        run: |
          mkdir -p delivery/apk delivery/tests delivery/source delivery/logs

          if [ -n "$ROOT" ] && [ -d "$ROOT" ]; then
            find "$ROOT/app/build/outputs/apk" -type f -name "*.apk" -size +0c -exec cp {} delivery/apk/ \; 2>/dev/null || true

            if [ -d "$ROOT/app/build/test-results" ]; then
              cp -r "$ROOT/app/build/test-results/." delivery/tests/ || true
            fi

            cd "$ROOT/.."
            zip -qr "$GITHUB_WORKSPACE/delivery/source/PW-PM-Android-Source.zip" "$(basename "$ROOT")" \
              -x "*/build/*" "*/.gradle/*" || true
          fi

          if [ -f build.log ]; then
            cp build.log delivery/logs/
          fi

          echo "Build outcome: ${{ steps.build.outcome }}" > delivery/logs/status.txt
          echo "Run URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> delivery/logs/status.txt
          find delivery -type f -print

      - name: Upload final delivery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PW-PM-FINAL-DELIVERY
          path: delivery/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail workflow if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
