name: Android Build & Verify (PW-DM, PW-PM, PW-FSWD, PW-DS)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Android SDK 34 & Build Tools
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          else
            echo "Using preinstalled Android SDK at $SDK_DIR"
            ls -la "$SDK_DIR/platforms" || true
          fi

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Extract yooo.zip and Restore Official Gradle 8.6 Wrapper & Checksum
        run: |
          unzip -o "yooo (2) (1).zip"
          test -d PW_PM_FINAL_ANDROID_PROJECT
          cd PW_PM_FINAL_ANDROID_PROJECT
          cat << 'PROPS' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-bin.zip
          distributionSha256Sum=9631d53cf3e74bfa726893aee1f8994fee4e060c401335946dba2156f440f24c
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPS
          gradle wrapper --gradle-version 8.6 --distribution-type bin
          chmod +x gradlew
          ./gradlew --version

      - name: Build All 4 Course APKs (DM, PM, FSWD, DS) and Run Unit Tests
        working-directory: PW_PM_FINAL_ANDROID_PROJECT
        run: |
          set -o pipefail
          ./gradlew clean assembleDmDebug assemblePmDebug assembleFswdDebug assembleDsDebug testPmDebugUnitTest --stacktrace 2>&1 | tee build.log

      - name: Collect & Verify All 4 Debug APKs
        working-directory: PW_PM_FINAL_ANDROID_PROJECT
        run: |
          mkdir -p collected_apks
          cp app/build/outputs/apk/dm/debug/app-dm-debug.apk collected_apks/PW-DM-debug.apk
          cp app/build/outputs/apk/pm/debug/app-pm-debug.apk collected_apks/PW-PM-debug.apk
          cp app/build/outputs/apk/fswd/debug/app-fswd-debug.apk collected_apks/PW-FSWD-debug.apk
          cp app/build/outputs/apk/ds/debug/app-ds-debug.apk collected_apks/PW-DS-debug.apk
          ls -lh collected_apks/
          sha256sum collected_apks/*.apk | tee collected_apks/apks-sha256.txt

      - name: Upload All 4 Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: pw-4-course-debug-apks
          path: PW_PM_FINAL_ANDROID_PROJECT/collected_apks/*
          if-no-files-found: error

      - name: Upload Build Logs & Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pw-build-logs-and-test-reports
          path: |
            PW_PM_FINAL_ANDROID_PROJECT/build.log
            PW_PM_FINAL_ANDROID_PROJECT/app/build/reports/tests/testPmDebugUnitTest/
            PW_PM_FINAL_ANDROID_PROJECT/app/build/test-results/testPmDebugUnitTest/
          if-no-files-found: warn
